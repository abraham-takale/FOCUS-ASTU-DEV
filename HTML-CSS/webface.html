<!doctype html>
<html>
  <head>
    <title>Button Practice</title>
    <style>
      .subscribe-styl {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        height: 100px;
        width: 800px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 50px;
        margin-right: 340px;
        transition:
          background-color 0s,
          color 0s,
          opacity 0s;
        box-shadow: 10px 10px 5px red;
      }
      .subscribe-styl:hover {
        opacity: 0.3;
      }
      .subscribe-styl:active {
        opacity: 0.8;
      }
      .subscribe-tyl {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 10px;
        cursor: pointer;
        margin-right: 10px;
        transition:
          background-color 0s,
          color 0s,
          opacity 0s;
        box-shadow: 10px 10px 10px red;
      }
      .subscribe-tyl:hover {
        opacity: 0.3;
      }
      .subscribe-tyl:active {
        opacity: 0.8;
      }
      .join-button:hover {
        background-color: green;
      }
      .join-button:active {
        background-color: blue;
      }
      .join-button {
        background-color: white;
        color: rgb(45, 126, 210);
        border-color: rgb(45, 150, 210);
        height: 100px;
        width: 800px;
        border-radius: 15px;
        border-width: 2px;
        border-style: solid;
        cursor: pointer;
        margin-right: 370px;
        margin-bottom: 20px;
        box-shadow: 10px 10px 10px blue;
      }
      .join-utton:hover {
        background-color: green;
      }
      .join-utton:active {
        background-color: blue;
      }
      .join-utton {
        background-color: white;
        color: rgb(45, 126, 210);
        border-color: rgb(45, 150, 210);
        height: 36px;
        width: 80px;
        border-radius: 15px;
        border-width: 2px;
        border-style: solid;
        cursor: pointer;
        box-shadow: 10px 10px 10px blue;
      }
      .tweet-button {
        background-color: rgb(45, 55, 210);
        border-color: none;
        color: white;
        height: 100px;
        width: 800px;
        border-radius: 20px;
        border-width: 2px;
        border-style: solid;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 50px;
        margin-right: 370px;
        box-shadow: 15px 10px 5px rgba(0, 0, 0, 0.9);
      }
      .tweet-button:hover {
        background-color: red;
        opacity: 1s;
        color: black;
      }
      .tweet-button:active {
        background-color: green;
        color: red;
      }
      .tweet-utton {
        background-color: rgb(45, 55, 210);
        border-color: none;
        color: white;
        height: 40px;
        width: 80px;
        border-radius: 20px;
        border-width: 2px;
        border-style: solid;
        font-size: 15px;
        font-weight: bold;
        box-shadow: 15px 10px 5px rgba(0, 0, 0, 0.9);
      }
      .tweet-utton:hover {
        background-color: red;
        opacity: 1s;
        color: black;
      }
      .tweet-utton:active {
        background-color: green;
        color: red;
      }
    </style>
  </head>
  <body>
    <!--this is comment-->
    <button class="subscribe-styl">

      application kana jion yoo gootan faayidaa isaan argattan <br />goal isaa<br />akkamitti akka join godhan  ❤️❤️❤️❤️✅</button>

    <button class="tweet-utton">

</html>
