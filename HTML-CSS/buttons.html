<style>
  .subscribe-styl {
    background-color: rgb(200, 0, 0);
    color: white;
    border: none;
    height: 36px;
    width: 105px;
    border-radius: 10px;
    cursor: pointer;
    margin-right: 10px;
    transition:
      background-color 0s,
      color 0s,
      opacity 0s;
    box-shadow: 10px 10px 10px red;
  }
  .subscribe-styl:hover {
    opacity: 0.3;
  }
  .subscribe-styl:active {
    opacity: 0.8;
  }
  .join-button:hover {
    background-color: green;
  }
  .join-button:active {
    background-color: blue;
  }
  .join-button {
    background-color: white;
    color: rgb(45, 126, 210);
    border-color: rgb(45, 150, 210);
    height: 36px;
    width: 80px;
    border-radius: 15px;
    border-width: 2px;
    border-style: solid;
    cursor: pointer;
    margin-right: 10px;
    box-shadow: 10px 10px 10px blue;
  }
  .tweet-button {
    background-color: rgb(45, 55, 210);
    border-color: none;
    color: white;
    height: 40px;
    width: 80px;
    border-radius: 20px;
    border-width: 2px;
    border-style: solid;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 15px 10px 5px rgba(0, 0, 0, 0.9);
  }
  .tweet-button:hover {
    background-color: red;
    opacity: 1s;
    color: black;
  }
  .tweet-button:active {
    background-color: green;
    color: red;
  }
</style>
<button class="subscribe-styl">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
